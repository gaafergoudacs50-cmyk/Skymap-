<html lang="en"><head><meta charset="utf-8">

<title>Sky Map</title>
<style>
:root{--bg:#02040c;--fg:#cfd8ff;--ui:rgba(6,12,30,.8);--ac:#7fa6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
body.red canvas{filter:sepia(1) saturate(6) hue-rotate(-52deg) brightness(.85)}
button{background:none;border:0;color:var(--fg);cursor:pointer;font:inherit;opacity:.8}
button:hover{opacity:1}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:42px;background:var(--ui);display:flex;align-items:center;gap:6px;padding:0 10px;backdrop-filter:blur(4px)}
#top b{font-weight:500;letter-spacing:.04em;margin-right:auto}
#top button{font-size:18px;width:34px;height:34px}
#sw{position:relative;display:none}#sw.on{display:block}
#q{background:#0a1430;border:1px solid #28407a;color:var(--fg);padding:6px 9px;border-radius:4px;width:200px;font:inherit}
#res{position:absolute;top:34px;right:0;width:100%;background:#0a1430;border:1px solid #28407a;max-height:50vh;overflow:auto}
#res div{padding:6px 9px;cursor:pointer;display:flex;justify-content:space-between}#res div:hover{background:#17306a}#res i{opacity:.55;font-style:normal;font-size:11px}
#side{position:fixed;left:8px;top:calc(60px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--ui);border:1px solid #1b2a55;border-radius:4px}
#side button{width:36px;height:36px;font-size:17px;opacity:.4}#side button.on{opacity:1;color:#ffb347}
#info{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:250px;max-width:calc(100% - 20px);background:var(--ui);border:1px solid #28407a;border-radius:6px;padding:10px 12px;backdrop-filter:blur(4px)}
#info[hidden]{display:none}
#info h2{margin:0;font-size:16px;font-weight:500}#info .cat{color:var(--ac);font-size:11px;margin-bottom:6px}
#info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0;font-variant-numeric:tabular-nums}#info dt{opacity:.55}#info dd{margin:0}
#info p{margin:6px 0 0;opacity:.8;line-height:1.35}#x{position:absolute;right:6px;top:4px;font-size:18px}
#tm{position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:11px;background:var(--ui);padding:4px 8px;border-radius:4px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 290px)}
#tm button{font-size:11px;padding:2px 5px;border:1px solid #28407a;border-radius:3px}#tl{opacity:.7;margin-left:4px}
@media(max-width:640px){#tm{bottom:auto;top:calc(48px + env(safe-area-inset-top,0px));left:auto;right:6px;max-width:60%}#side{top:calc(90px + env(safe-area-inset-top,0px))}}
